name: Publish image

# Builds the image for both Intel and ARM and pushes it to the GitHub
# Container Registry, so nobody has to build it themselves. A restaurant
# owner should be able to run Ledger with one docker command and no
# toolchain: no Node, no Python, no git clone.
#
# ARM matters more than it looks — Apple Silicon Macs and Raspberry Pis are
# both arm64, and an amd64-only image either refuses to start or crawls
# under emulation. A Pi is a genuinely good box to leave running in a shop.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed to build the arm64 variant on an Intel runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A pushed image that does not run is worse than no image, because
      # people trust a green tick. Pull the published amd64 image back down
      # and make it serve a page before anyone else gets it.
      - name: The published image must actually serve the app
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name ledger-verify -p 8080:8080 \
            -e LEDGER_OWNER_PASSWORD=publish-check-password \
            --pull always "$IMAGE"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
              echo "health ok, SPA returned $code"
              [ "$code" = "200" ] || { echo "app did not serve"; exit 1; }
              exit 0
            fi
            sleep 3
          done
          echo "published image never became healthy:"
          docker logs ledger-verify
          exit 1

  # The README tells Windows users to download an exe from the latest
  # release. That link has to lead somewhere, so the tag that publishes an
  # image also builds and attaches the executable.
  windows-exe:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: pip install -r server/requirements.txt pyinstaller
      - run: python -m PyInstaller packaging/ledger.spec --noconfirm --distpath dist-exe

      # Same rule as the image: never hand out a build that has not started.
      - name: The executable must actually serve the app
        shell: pwsh
        run: |
          $env:LEDGER_DATA_DIR = "$env:RUNNER_TEMP\ledger-release-check"
          $env:LEDGER_OWNER_PASSWORD = "release-check-password"
          $env:LEDGER_PORT = "8080"
          $p = Start-Process .\dist-exe\OotaaLedger.exe -PassThru
          $ok = $false
          foreach ($i in 1..45) {
            try {
              if ((Invoke-WebRequest http://127.0.0.1:8080/api/health -UseBasicParsing).StatusCode -eq 200) {
                $ok = $true; break
              }
            } catch { Start-Sleep 2 }
          }
          if (-not $ok) { throw "the executable never became healthy" }
          if ((Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing).StatusCode -ne 200) {
            throw "the web pages are not bundled"
          }
          Stop-Process -Id $p.Id -Force

      # Inno Setup is preinstalled on the GitHub Windows runners.
      - name: Wrap it in an installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\ledger.iss

      # Both are offered: the installer for people who want a Start Menu
      # entry, and the bare exe for people who want to carry it on a stick.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-exe/OotaaLedger-Setup.exe
            dist-exe/OotaaLedger.exe
