[pytest]
# The suite is almost entirely fixture setup: every test builds a fresh
# database, seeds it and signs in. That work is independent, so it runs
# across every core the machine has. Serially this suite takes eight and a
# half minutes; in parallel it takes well under one.
#
# Each worker gets its own data directory (see tests/conftest.py), so the
# workers never share a SQLite file.
addopts = -q -n auto
testpaths = tests
